name: Deploy API

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "src/api/**"
      - "src/medallion/gold/**"
      - "Dockerfile"
      - "requirements.txt"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/ahold-freshness-api:${{ github.sha }}
            ${{ secrets.ACR_NAME }}.azurecr.io/ahold-freshness-api:latest

      - name: Update Container App revision
        run: |
          az containerapp update \
            --name ${{ secrets.ACA_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/ahold-freshness-api:${{ github.sha }}

      - name: Verify health endpoint
        run: |
          ACA_FQDN=$(az containerapp show \
            --name ${{ secrets.ACA_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)
          for i in $(seq 1 12); do
            HTTP_STATUS=$(curl -sf -o /tmp/health.json -w "%{http_code}" "https://${ACA_FQDN}/health" 2>/dev/null || echo "000")
            if [ "$HTTP_STATUS" = "200" ] && jq -e '.status == "ok"' /tmp/health.json >/dev/null 2>&1; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP_STATUS, waiting 5s..."
            sleep 5
          done
          echo "Health check failed after 60s"
          cat /tmp/health.json 2>/dev/null || true
          exit 1

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: pip install pytest httpx

      - name: Run E2E smoke tests
        env:
          E2E_API_BASE: ${{ secrets.E2E_API_BASE }}
          E2E_MANAGER_ID: github-actions-e2e
        run: pytest tests/e2e/ -v --tb=short
